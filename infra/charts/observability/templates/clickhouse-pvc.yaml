{{- if .Values.clickhouse.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.clickhouse.name }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.resourceLabels" (dict "root" . "name" .Values.clickhouse.name "component" "database") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.clickhouse.persistence.storageClassName }}
  storageClassName: {{ .Values.clickhouse.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.clickhouse.persistence.size }}
{{- end }}
