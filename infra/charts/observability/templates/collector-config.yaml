apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.resourceLabels" (dict "root" . "name" .Values.collector.name "component" "collector") | nindent 4 }}
data:
  config.yaml: |
    extensions:
      bearertokenauth/ingestion:
        token: ${env:INGESTION_COLLECTOR_TOKEN}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            auth:
              authenticator: bearertokenauth/ingestion
          http:
            endpoint: 0.0.0.0:4318
            auth:
              authenticator: bearertokenauth/ingestion
      otlp/ingestion:
        protocols:
          http:
            endpoint: 0.0.0.0:4319
            include_metadata: true
            auth:
              authenticator: bearertokenauth/ingestion

    processors:
      resource/ingestion:
        attributes:
          - key: org.slug
            action: delete
          - key: team.id
            action: delete
          - key: org.slug
            from_context: metadata.x-telemetry-org
            action: upsert
          - key: team.id
            from_context: metadata.x-telemetry-team
            action: upsert
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      batch:
        timeout: 10s
        send_batch_size: 512

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse:9000?dial_timeout=10s
        database: default
        ttl: 168h
        create_schema: true
        traces_table_name: otel_traces
        logs_table_name: otel_logs
        metrics_table_name: otel_metrics
        timeout: 30s
        sending_queue:
          enabled: true
          queue_size: 5000
          num_consumers: 10
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      debug:
        verbosity: basic

    service:
      extensions: [bearertokenauth/ingestion]
      pipelines:
        traces/ingestion:
          receivers: [otlp/ingestion]
          processors: [memory_limiter, resource/ingestion, batch]
          exporters: [clickhouse]
        logs/ingestion:
          receivers: [otlp/ingestion]
          processors: [memory_limiter, resource/ingestion, batch]
          exporters: [clickhouse]
        metrics/ingestion:
          receivers: [otlp/ingestion]
          processors: [memory_limiter, resource/ingestion, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse, debug]
