apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.resourceLabels" (dict "root" . "name" .Values.collector.name "component" "collector") | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      batch:
        timeout: 10s
        send_batch_size: 512

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse:9000?dial_timeout=10s
        database: default
        ttl: 168h
        create_schema: true
        traces_table_name: otel_traces
        logs_table_name: otel_logs
        metrics_table_name: otel_metrics
        timeout: 30s
        sending_queue:
          enabled: true
          queue_size: 5000
          num_consumers: 10
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [clickhouse, debug]