apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.resourceLabels" (dict "root" . "name" .Values.backend.name "component" "api") | nindent 4 }}
spec:
  {{- if ne (int .Values.backend.replicaCount) 1 }}
  {{- fail "SQLite control-plane storage requires backend.replicaCount=1" }}
  {{- end }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- if .Values.backend.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  # Deployment selectors are immutable; keep the original selector for upgrades.
  selector:
    matchLabels:
      app: {{ .Values.backend.name }}
  template:
    metadata:
      labels:
        {{- include "observability.podLabels" (dict "root" . "name" .Values.backend.name "component" "api") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "false"
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.backend.serviceAccount.name }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: INGESTION_COLLECTOR_ENDPOINT
              value: {{ printf "http://%s:4319" .Values.collector.name | quote }}
            - name: INGESTION_COLLECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestion.secretName | quote }}
                  key: INGESTION_COLLECTOR_TOKEN
            - name: INGESTION_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ingestion.secretName | quote }}
                  key: INGESTION_KEYS_JSON
            - name: AUTH_DB_PATH
              value: /var/lib/telemetry-hub/platform.sqlite
            {{- range .Values.backend.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.backend.otelServiceName | default "backend-service" | quote }}
            - name: DEPLOY_ENV
              value: {{ .Values.backend.deploymentEnvironment | default "production" | quote }}
          {{- if .Values.backend.authSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.backend.authSecretName }}
          {{- end }}
          volumeMounts:
            - name: platform-store
              mountPath: /var/lib/telemetry-hub
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: platform-store
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.name }}-platform-store
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
