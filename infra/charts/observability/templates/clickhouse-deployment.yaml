apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.clickhouse.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
    app.kubernetes.io/component: database
spec:
  replicas: {{ .Values.clickhouse.replicaCount }}
  # Deployment selectors are immutable; keep the original selector for upgrades.
  selector:
    matchLabels:
      app: {{ .Values.clickhouse.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.clickhouse.name }}
        app.kubernetes.io/name: {{ .Values.clickhouse.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
      {{- with .Values.clickhouse.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.clickhouse.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.clickhouse.name }}
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          {{- with .Values.clickhouse.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # This is intentionally passwordless for the isolated local Kind cluster.
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.service.http.port }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.clickhouse.service.native.port }}
              protocol: TCP
          {{- with .Values.clickhouse.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.clickhouse.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.clickhouse.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
      volumes:
        # The local demo intentionally discards telemetry when the pod is removed.
        - name: clickhouse-data
          emptyDir: {}
      {{- with .Values.clickhouse.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
    app.kubernetes.io/component: database
  {{- with .Values.clickhouse.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.clickhouse.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Values.clickhouse.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.clickhouse.service.http.port }}
      targetPort: http
      protocol: TCP
    - name: native
      port: {{ .Values.clickhouse.service.native.port }}
      targetPort: native
      protocol: TCP
