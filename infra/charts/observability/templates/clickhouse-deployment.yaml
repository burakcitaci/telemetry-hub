apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.clickhouse.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.clickhouse.name }}
    version: v1
    managed-by: helm
spec:
  replicas: {{ .Values.clickhouse.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.clickhouse.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.clickhouse.name }}
        version: v1
      {{- with .Values.clickhouse.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.clickhouse.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      containers:
        - name: {{ .Values.clickhouse.name }}
          image: "{{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          
          command:
            - /bin/bash
            - -c
            - |
              # Fix ClickHouse to listen on all interfaces
              sed -i 's/<http_port>8123<\/http_port>/<http_port>8123<\/http_port>\n<listen_host>0.0.0.0<\/listen_host>/g' /etc/clickhouse-server/config.xml
              sed -i 's/<native_port>9000<\/native_port>/<native_port>9000<\/native_port>\n<listen_host>0.0.0.0<\/listen_host>/g' /etc/clickhouse-server/config.xml
              # Start ClickHouse in background
              /entrypoint.sh &
              # Wait for user config to be created and modify it
              while [ ! -f /etc/clickhouse-server/users.d/default-user.xml ]; do sleep 1; done
              sed -i 's|<ip>::1</ip>|<ip>::/0</ip>|g' /etc/clickhouse-server/users.d/default-user.xml
              sed -i 's|<ip>127.0.0.1</ip>|<ip>0.0.0.0/0</ip>|g' /etc/clickhouse-server/users.d/default-user.xml
              # Send SIGHUP to reload configuration
              pkill -HUP clickhouse-server
              # Wait for background process
              wait
          
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.service.http.port }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.clickhouse.service.native.port }}
              protocol: TCP
          
          {{- with .Values.clickhouse.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          {{- with .Values.clickhouse.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          {{- with .Values.clickhouse.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d
      
      volumes:
        - name: clickhouse-data
          emptyDir: {}
        - name: clickhouse-config
          configMap:
            name: clickhouse-config
      
      {{- with .Values.clickhouse.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.clickhouse.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.clickhouse.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.clickhouse.name }}
    managed-by: helm
  {{- with .Values.clickhouse.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.clickhouse.service.type }}
  selector:
    app: {{ .Values.clickhouse.name }}
  ports:
    - name: http
      port: {{ .Values.clickhouse.service.http.port }}
      targetPort: http
      protocol: TCP
    - name: native
      port: {{ .Values.clickhouse.service.native.port }}
      targetPort: native
      protocol: TCP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.clickhouse.name }}
    managed-by: helm
data:
  no-auth.xml: |
    <clickhouse>
      <users>
        <default>
          <password></password>
          <networks>
            <ip>::/0</ip>
            <ip>0.0.0.0/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
        </default>
      </users>
    </clickhouse>
