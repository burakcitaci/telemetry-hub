apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.collector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.collector.name }}
    app.kubernetes.io/component: collector
spec:
  replicas: {{ .Values.collector.replicaCount }}
  # Deployment selectors are immutable; keep the original selector for upgrades.
  selector:
    matchLabels:
      app: {{ .Values.collector.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.collector.name }}
        app.kubernetes.io/name: {{ .Values.collector.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Values.collector.name }}
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          {{- with .Values.collector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.collector.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.collector.name }}
    app.kubernetes.io/component: collector
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.collector.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  type: ClusterIP
