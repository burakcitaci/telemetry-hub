# Global settings
global:
  namespace: telemetry-hub
  environment: development

# Backend Service Configuration
backend:
  name: backend
  replicaCount: 1
  image:
    repository: local/backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3001
    annotations: {}

  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 3001
    initialDelaySeconds: 20
    periodSeconds: 60 # every 30s is fine
    timeoutSeconds: 10 # 10s is fine
    failureThreshold: 3 # 3 failures is a problem

  readinessProbe:
    httpGet:
      path: /health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 65
    timeoutSeconds: 5
    failureThreshold: 2 # 2 failures is a problem

  # Environment variables
  env:
    - name: PORT
      value: "3001"
    - name: HOST
      value: "0.0.0.0"
    - name: NODE_ENV
      value: "production"
    - name: CLICKHOUSE_HOST
      value: "clickhouse.telemetry-hub.svc.cluster.local"
    - name: CLICKHOUSE_PORT
      value: "8123"
    - name: CLICKHOUSE_DATABASE
      value: "default"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector.telemetry-hub.svc.cluster.local:4318"
    - name: OTEL_SERVICE_NAME
      value: "backend-service"
    - name: OTEL_SERVICE_VERSION
      value: "1.0.0"

  # Resource management
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  # Pod security and network
  securityContext:
    runAsNonRoot: false
    fsReadOnlyRootFilesystem: false

  affinity: {}
  nodeSelector: {}
  tolerations: []

  # Pod annotations
  podAnnotations: {}

# ClickHouse Configuration
clickhouse:
  name: clickhouse
  replicaCount: 1

  image:
    repository: clickhouse/clickhouse-server
    tag: "25.9" # Pin version for stability
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    http:
      port: 8123
    native:
      port: 9000
    annotations: {}

  # Health checks
  livenessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  # Resource management
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Storage
  persistence:
    enabled: false # Set to true for production with PVC
    size: 10Gi
    storageClassName: ""

  # Pod security and network
  securityContext:
    runAsNonRoot: false
    fsReadOnlyRootFilesystem: false

  affinity: {}
  nodeSelector: {}
  tolerations: []

  # Pod annotations
  podAnnotations: {}

# Namespace configuration
namespace:
  create: true
  name: telemetry-hub

# Ingress (optional)
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: observability.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Service Monitor (for Prometheus, optional)
serviceMonitor:
  enabled: false
