backend:
  name: backend
  replicaCount: 1

  image:
    repository: local/backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3001
    annotations: {}

  livenessProbe:
    httpGet:
      path: /health
      port: 3001
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 3001
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 2

  env:
    - name: PORT
      value: "3001"
    - name: HOST
      value: "0.0.0.0"
    - name: NODE_ENV
      value: "production"
    - name: CLICKHOUSE_HOST
      value: "clickhouse"
    - name: CLICKHOUSE_PORT
      value: "8123"
    - name: CLICKHOUSE_DATABASE
      value: "default"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector:4318"
    - name: OTEL_SERVICE_NAME
      value: "backend-service"
    - name: OTEL_SERVICE_VERSION
      value: "1.0.0"

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  podSecurityContext:
    runAsNonRoot: false

  containerSecurityContext:
    readOnlyRootFilesystem: false

  affinity: {}
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

clickhouse:
  name: clickhouse
  replicaCount: 1

  image:
    repository: clickhouse/clickhouse-server
    tag: "26.3.17.56"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    http:
      port: 8123
    native:
      port: 9000
    annotations: {}

  livenessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ping
      port: 8123
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  podSecurityContext:
    runAsNonRoot: false

  containerSecurityContext:
    readOnlyRootFilesystem: false

  affinity: {}
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}

collector:
  name: opentelemetry-collector
  replicaCount: 1

  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    tag: "0.153.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
