name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The runner's packaged Chrome can use Ubuntu's browser sandbox.
      TEST_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Check headless Chrome
        run: '"$TEST_BROWSER" --headless --disable-gpu --dump-dom about:blank'
      - run: yarn verify
        env:
          TEST_KIND_CLICKHOUSE: '0'
      - run: docker build -f apps/frontend/Dockerfile -t telemetry-hub-frontend-check .
      - run: node scripts/frontend-proxy-smoke.mjs telemetry-hub-frontend-check
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/backend/Dockerfile -t telemetry-hub-check .
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/container-smoke.mjs telemetry-hub-check
