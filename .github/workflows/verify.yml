name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: yarn verify
        env:
          TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          TEST_KIND_CLICKHOUSE: '0'
      - run: docker build -f apps/frontend/Dockerfile -t telemetry-hub-frontend-check .
      - run: node scripts/frontend-proxy-smoke.mjs telemetry-hub-frontend-check
        env:
          TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/backend/Dockerfile -t telemetry-hub-check .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/container-smoke.mjs telemetry-hub-check
