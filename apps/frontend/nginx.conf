map $http_host $localhost_redirect {
    default "";
    ~^127\.0\.0\.1(?<localhost_port>:[0-9]+)?$ http://localhost$localhost_port;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    # Secure session cookies use localhost's local-development exception.
    # Preserve the published port, path and query before loading the application.
    if ($localhost_redirect != "") {
        return 307 $localhost_redirect$request_uri;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
        client_max_body_size 8m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
